<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Login</title>
		<script type="text/javascript" src="login.js"></script>
		<link rel="stylesheet" href="register.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Oooh+Baby&family=Palette+Mosaic&family=Pangolin&family=Reenie+Beanie&display=swap" rel="stylesheet">
	</head>
	<body>
		<div class="Login">
			<form name="myLogin" id ="myLogin">
				<div class="fieldset2">
				<fieldset>
					<legend id="loginLegend">Login</legend>
					<div class="Username">
					Username : 
					<input type="text" name="username" id="username" required>
					</div>

					<div class="Password">
					Password : 
					<input type="password" name="password" id="password" required>
					</div>

					<input type="submit" value="Login" id="loginBtn">
					<input type="reset" value="Clear" id="clearBtn">

				</fieldset>
				</div>

			</form>
		</div>
	</body>
</html>

<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Register</title>
		<script type="text/javascript" src="register.js"></script>
		<link rel="stylesheet" href="register.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Oooh+Baby&family=Palette+Mosaic&family=Pangolin&family=Reenie+Beanie&display=swap" rel="stylesheet">
	</head>
	<body>
		<div class="Register"> 
			<form name="myRegister" id="myRegister" action="login.html">
				<div class="fieldset">

				<fieldset>
					<legend id="registerLegend">Register</legend>
					<p id="requiredMsg">*require*</p> <br>
					<!-- <span id="errormsg"></span> <br> -->

					<div class="name">
					First name : 
					<input type="text" name="firstname" id="firstname" required>
					</div>

					<div class="lastname">
					Last name : 
					<input type="text" name="lastname" id="lastname" required>
					</div>

					<div class="radio">
					Gender : 
						<input type="radio" name="gender" value="male" >Male
						<input type="radio" name="gender" value="female" >Female
						<input type="radio" name="gender" value="other" >Other
					</div>
					
					<div class="birthday"> 
					Birthday : 
					<input type="date" name="bday" value="" id="birthday" required>
					</div>

					<div class="email">
					Email address : 
					<input type="email" name="email" id="email" required>
					</div>

					<div class="user">
					Username : 
					<input type="text" name="username" id="user" required >
					</div>

					<div class="pass">
					Password : 
					<input type="password" name="password" id="pass" required>
					</div>

					<div class="retypepass">
					RetypePassword : 
					<input type="password" name="password" id="retypepass" required>
					</div>
			
					<input type="submit" value="Register" id="registerBtn">
					<input type="reset" value="Reset" id="resetBtn">
				</fieldset>
				</div>
			</form>
		</div>
		
	</body>
</html>
